name: Görsel Çizici uygulaması

on:
  push:
    paths:
      - "gorsel-cizici/**"
      - ".github/workflows/gorsel-cizici.yml"
  workflow_dispatch:

concurrency:
  group: gorsel-cizici-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: mac-apple-silicon
          - os: macos-15-intel
            name: mac-intel
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    env:
      # Windows konsolu Türkçe harfleri yazabilsin
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    defaults:
      run:
        working-directory: gorsel-cizici
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gereken paketler (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Gereken paketler (Mac, macOS 12 ve üstünde çalışan sürümler)
        if: runner.os == 'macOS'
        # derleme makinesinin macOS'u yeni: pip kendiliğinden yalnız yeni macOS'ta çalışan
        # kütüphaneleri seçer (uygulama eski Mac'lerde açılmaz). macOS 12 için olanlar indirilip kurulur.
        run: |
          python -m pip install --upgrade pip
          pip download --only-binary=:all: --platform "macosx_12_0_$(uname -m)" --python-version 3.12 \
            --implementation cp --abi cp312 --abi abi3 --abi none -r requirements.txt -d tekerlek
          pip install --no-index --find-links tekerlek -r requirements.txt
          pip install pyinstaller
      - name: Çizim motorunu dene
        run: python GorselCizici.py --test
      - name: Mac yazı tanımasını dene
        if: runner.os == 'macOS'
        run: python GorselCizici.py --ocr-test
      - name: Simge (Mac)
        if: runner.os == 'macOS'
        run: |
          python paketleme/simge.py
          iconutil -c icns simge.iconset -o simge.icns
      - name: Simge (Windows)
        if: runner.os == 'Windows'
        run: python paketleme/simge.py --ico
      - name: Uygulamayı paketle
        run: pyinstaller --noconfirm GorselCizici.spec
      - name: En düşük macOS sürümünü denetle (12)
        if: runner.os == 'macOS'
        run: |
          ARCH=$(uname -m)
          bad=0
          n=0
          while IFS= read -r -d '' f; do
            case "$(file -b "$f")" in *Mach-O*) ;; *) continue ;; esac
            n=$((n + 1))
            v=$(otool -arch "$ARCH" -l "$f" 2>/dev/null | awk '/LC_BUILD_VERSION/{b=1} b&&$1=="minos"{print $2; exit} /LC_VERSION_MIN_MACOSX/{m=1} m&&$1=="version"{print $2; exit}') || true
            if [ -z "$v" ]; then echo "bu mimari ($ARCH) yok ya da okunamadı: $f"; bad=1; continue; fi
            if [ "${v%%.*}" -gt 12 ]; then echo "macOS $v istiyor: $f"; bad=1; fi
          done < <(find dist/GorselCizici.app -type f -print0)
          echo "$n ikili dosya denetlendi"
          test "$n" -gt 0
          test "$bad" = 0
      - name: Paketlenmiş uygulamayı dene (Mac)
        if: runner.os == 'macOS'
        run: |
          QT_QPA_PLATFORM=offscreen dist/GorselCizici.app/Contents/MacOS/GorselCizici --test
          dist/GorselCizici.app/Contents/MacOS/GorselCizici --ocr-test
      - name: Paketlenmiş uygulamayı dene (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/GorselCizici/GorselCizici.exe" -ArgumentList "--test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "test başarısız: $($p.ExitCode)" }
      - name: Kurulum dosyası (Mac, .dmg)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dmg
          cp -R dist/GorselCizici.app dmg/
          ln -s /Applications dmg/Applications
          # hdiutil bazen "Resource busy" der (sistem diski tararken): birkaç kez dene
          for i in 1 2 3 4 5; do
            if hdiutil create -volname "Gorsel Cizici" -srcfolder dmg -ov -format UDZO GorselCizici-${{ matrix.name }}.dmg; then
              break
            fi
            if [ "$i" = 5 ]; then exit 1; fi
            sleep $((i * 5))
          done
      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/GorselCizici -DestinationPath GorselCizici-${{ matrix.name }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: GorselCizici-${{ matrix.name }}
          path: |
            gorsel-cizici/GorselCizici-${{ matrix.name }}.dmg
            gorsel-cizici/GorselCizici-${{ matrix.name }}.zip
          if-no-files-found: error
          retention-days: 90

  # Derlenen kurulum dosyalarını tek tıkla indirilebilsin diye "Releases" sayfasına koy
  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Kurulum dosyalarını yayımla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -R out
          gh release delete gorsel-cizici -y --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create gorsel-cizici -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Görsel Çizici" \
            --notes "Mac (Apple çipli): GorselCizici-mac-apple-silicon.dmg · Mac (Intel): GorselCizici-mac-intel.dmg · Windows: GorselCizici-windows.zip" \
            out/*/*.dmg out/*/*.zip
